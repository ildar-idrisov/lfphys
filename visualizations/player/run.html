<style id="ux-framework">
/* The player's frame after the UX reviews of 2026-11-04 (UX-ui U9, U14, U16, U20-U24; UX-params P1, P2, P4, P23). */
/* side columns that fold away, the centre takes the room (U20) */
.main { --lw: 300px; --rw: 360px; grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw); }
@media (max-width: 1280px) { .main { --lw: 260px; --rw: 300px; } }
.run.fold-left .main { --lw: 0px; } .run.fold-right .main { --rw: 0px; }
#left { grid-column: 1; } #center { grid-column: 2; } #right { grid-column: 3; }  /* a folded column keeps its cell */
.run.fold-left #left, .run.fold-right #right { display: none; }
@media (max-width: 1000px) { .main { grid-template-columns: 1fr; } #left, #center, #right { grid-column: auto; } }
.topbar .fold { padding: 2px 7px; }
.run.fold-left #fold-left, .run.fold-right #fold-right { background: var(--accent); color: #fff; border-color: var(--accent); }
.topbar { gap: 8px 10px; }
.topbar .badge { white-space: nowrap; max-width: 26em; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle; }
#scene { max-width: 28em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1500px) { #runid { display: none; } #scene { max-width: 12em; } .topbar .badge { max-width: 15em; } }  /* the run's id: in "About the run" */
/* one row at every width the player is used at (review LB1-p02-ux X8: the bar wrapped in p01, at 1280 px and after a
   second world added its selector, and the columns below jumped): the names, the badges and the world selector shrink
   with an ellipsis (their full text in the tooltip), the buttons never */
.topbar { flex-wrap: nowrap; overflow: hidden; }
.topbar > * { flex: none; }
/* the physics badges keep their width (each is capped by its max-width above, its full text in the tooltip): «standard
   physics» or «МОДИФИЦИРОВАННАЯ ФИЗИКА: …» is never cut to «станда…»; the scene and the title shrink first (review
   i18n-browser F13) */
.topbar > #title { flex: 0 2 auto; min-width: 5em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar > #scene { flex: 0 6 auto; min-width: 0; }
.topbar > #physics { flex: none; display: flex; gap: 4px; }
.topbar > #physics .badge { flex: none; }
.topbar > #world { flex: 0 3 auto; min-width: 5.5em; max-width: 18em; text-overflow: ellipsis; }
.topbar > #busy { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; }
.topbar > #status { white-space: nowrap; }
.topbar > .grow { flex: 1 1 0; min-width: 0; }
/* the bottom bar in one line at 1280 px and 1600 px (U20, U24): narrower minima, a readable speed scale */
.bottombar { flex-wrap: nowrap; gap: 6px; }
.bottombar .timeline { min-width: 90px; }
.bottombar .time { min-width: 0; white-space: nowrap; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; max-width: 17em; }
.speedbox { width: min(300px, 22vw); min-width: 130px; padding-bottom: 14px; }
.speedbox .ticks { font-size: 11px; height: 14px; }
#speedv { min-width: 6.5em !important; white-space: nowrap; }
.bottombar > span.muted { white-space: nowrap; }
@media (max-width: 1100px) { .bottombar { flex-wrap: wrap; } }
/* what the world computes now, with a way out (U9) */
.busy { display: inline-flex; align-items: center; gap: 6px; }
.busy button.cancel { font-size: 11px; padding: 1px 6px; border-color: var(--bad); color: var(--bad); }
/* the checks: one line each, the ✓ column always visible, notes behind ⓘ (U16); an expected failure (P23) */
.checks table { table-layout: fixed; }
.checks col.c-val { width: 42%; } .checks col.c-st { width: 22px; }
.checks td { overflow-wrap: anywhere; }
.checks td.ck-st { text-align: center; }
.checks .grp-row { cursor: pointer; }
.checks .grp-row .fold { color: var(--muted); }
.checks .grp-sum { float: right; font-weight: 400; color: var(--muted); }
.checks .grp-sum.st-bad { color: var(--bad); }
.checks .ck-i { border: 0; background: none; padding: 0 3px; color: var(--muted); cursor: pointer; font-size: 11px; }
.checks .ck-note { margin-top: 2px; font-size: 11px; }
.st-exp { color: var(--warn); font-weight: 700; }
/* "Events": a failure's own text folded (P4) */
.events .ev-detail { margin: 2px 0 0 0; color: var(--muted); }
.events .ev-detail summary { cursor: pointer; font-size: 11px; }
.events .ev-detail .mono { white-space: pre-wrap; font-size: 11px; }
/* refused values at their fields (P2) */
.ctl-err:empty, .field-err:empty { display: none; }
.ctl-err, .field-err { grid-column: 1 / -1; color: var(--bad); font-size: 11px; }
.field.bad input, .field.bad select { border-color: var(--bad); }
/* the playground: why a palette button is off (U22), the pre-placement form (U4) */
.pg-btn { display: inline-flex; flex-direction: column; max-width: 100%; }
.pg-why { font-size: 10px; color: var(--muted); max-width: 16em; line-height: 1.2; }
.pg-buttons button.on { outline: 2px solid var(--accent); }
.pg-place { border: 1px solid var(--accent); border-radius: 8px; padding: 6px 8px; margin: 8px 0; }
.pg-place .name { font-weight: 600; margin-bottom: 4px; }
.pg-place .row { display: flex; gap: 6px; margin-top: 6px; }
/* the camera on an object (UX-3d A6) */
.pg-cam { display: flex; gap: 6px; margin: 4px 0 6px; }
.pg-cam button.toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.pg-eye { font-size: 11px; }
.pg-manip { margin-bottom: 6px; }
.pg-manip .row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
.pg-carry { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
body.picking .s3d-canvas, body.picking .sw-canvas { cursor: crosshair; outline: 2px dashed var(--accent); }
/* a world without slice planes: no slice tools in the 3-D toolbar (U21) */
.run.no-slices .s3d-tools button.s3d-move, .run.no-slices .s3d-tools button.s3d-tilt { display: none; }
.run.no-field .s3d-tools select.s3d-scale { display: none; }
/* a recording's badge keeps its width at every size: the title and the scene shrink first (review P17-start-page F11) */
.topbar > .badge.rec-badge { flex: none; max-width: none; }
/* narrow screens: a phone, a tablet upright (review P17-start-page F1; integrator D8: the public site's player must work at
   390 px). One column that scrolls: the picture first with at least a screen's room (the views' canvases had zero height
   when the three columns were stacked into one window-high grid), the side columns under it (⇤ and ⇥ still hide them), the
   top bar wraps and keeps the RECORDING badge, the transport stays at the bottom of the screen; nothing wider than the
   screen */
@media (max-width: 1000px) {
  html, body { height: auto; }
  .run { height: auto; min-height: 100vh; grid-template-rows: auto auto auto; grid-template-columns: minmax(0, 1fr); }
  .run > * { min-width: 0; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .main > * { min-width: 0; max-width: 100vw; }
  #center { order: -1; min-height: max(calc(100vh - 170px), 440px); }
  /* the picture first, a view's own control rows (set-up copies, display toggles) under it (integrator, D8 screenshots) */
  #center > * > :not(:has(canvas)) { order: 1; }
  .side, .side.right { max-height: none; overflow: visible; border: 0; border-top: 1px solid var(--line); }
  #center .split { grid-template-columns: minmax(0, 1fr) !important; grid-auto-rows: minmax(260px, 1fr); flex: 1 0 auto; min-height: auto; }
  #center .split > div { border-right: 0; border-bottom: 1px solid var(--line); }
  #center .canvas-wrap { min-height: 220px; }
  #center .s3d { flex-direction: column; flex: 1 0 auto; }
  #center .s3d-view { flex: 1 0 auto; min-height: max(52vh, 300px); }
  #center .s3d-windows, #center .s3d-windows.wide { flex: 0 0 auto; border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  #center .toolbar, #center .qc { flex-wrap: wrap; max-width: 100%; }
  #center select, .side select { max-width: 100%; }
  .topbar { flex-wrap: wrap; overflow: visible; padding: 6px 8px; }
  .topbar > #title { flex: 1 1 8em; }
  .topbar > #scene { display: none; }
  .topbar > #physics { flex-wrap: wrap; max-width: 100%; }
  .topbar .badge, .topbar > .badge.rec-badge { max-width: 100%; }
  .topbar > .grow { display: none; }
  .topbar > #status { white-space: normal; }
  .bottombar { position: sticky; bottom: 0; z-index: 20; flex-wrap: wrap; gap: 6px; }
  .bottombar .timeline { order: 10; flex: 1 1 100%; min-width: 0; }
  .bottombar .time { order: 11; max-width: none; }
  .speedbox { width: auto; flex: 1 1 140px; min-width: 120px; }
  .toast, .toasts { max-width: calc(100vw - 28px); }
  .modal > div { max-width: calc(100vw - 16px); padding: 14px; }
}
</style>
<!-- the module specifiers of the player and of every world's view, and the 3-D environment's three.js (player/vendor/README.md);
     the site build points them at its own copies -->
<script type="importmap">{"imports": {"three": "/static/vendor/three-0.185.1/three.module.min.js", "/static/": "/static/", "/viz/": "/viz/"}}</script>

<body>
<div class="run" id="app">
  <div class="topbar">
    <a href="/" data-page="" data-t-title title="To the start page: the demonstrations by audience and the laboratories" data-t>← Start page</a>
    <button id="fold-left" class="fold" data-t-title title="Hide / show the left column ([)">⇤</button>
    <span class="title" id="title">…</span>
    <span id="scene" class="muted"></span>
    <span id="physics"></span>
    <select id="world" data-t-title title="The worlds of this run: the current one and the earlier ones (from the record)" style="display:none"></select>
    <span class="grow"></span>
    <span id="busy" class="busy" style="display:none"></span>
    <span id="status"><span class="dot"></span><span data-t>connecting…</span></span>
    <span id="runid" class="muted mono"></span>
    <button id="keep" data-t-title title="Keep the record for good">☆</button>
    <a href="/settings" data-page="settings" data-server-only target="_blank" data-t-title title="Where to compute (CPU / GPU) and with what precision — for new runs">⚙</a>
    <a href="/legal" data-page="legal" target="_blank" data-t-title title="Licence, citation, third-party code and disclaimer">§</a>
    <button id="theme" data-t-title title="Theme (T)">◐</button>
    <button id="help" data-t-title title="Help (?)">?</button>
    <button id="fold-right" class="fold" data-t-title title="Hide / show the right column (])">⇥</button>
  </div>
  <div class="main">
    <div class="side" id="left"></div>
    <div class="center" id="center"></div>
    <div class="side right" id="right"></div>
  </div>
  <div class="bottombar">
    <button id="rec" class="rec" data-t-title title="Record: the world is computed further, frames are added to the record; again — pause (Space)">⏺</button>
    <button id="tostart" data-t-title title="To the start of the record (Home)">⏮</button>
    <button id="back" data-t-title title="Play the record backwards (←)">◀</button>
    <button id="fwd" data-t-title title="Play the record forwards (→)">▶</button>
    <button id="toend" data-t-title title="To the end of the record (End): live while recording">⏭</button>
    <button id="step" data-t-title title="A frame forward; at the end of the record, compute one step">|▶</button>
    <button id="next" data-t-title title="To the next event; at the end of the record, compute up to it (N)" data-t>⏭ event</button>
    <span class="muted" data-t>speed</span>
    <span class="speedbox"><input id="speed" type="range" min="0" max="1000" data-t-title title="World seconds per second (logarithmic scale)"><span id="speedticks" class="ticks"></span></span>
    <span id="speedv" class="mono"></span>
    <span id="speedfact" class="mono warn"></span>
    <button id="rt" data-t-title title="Real time: 1 s of the world per 1 s">1:1</button>
    <input id="timeline" class="timeline" type="range" min="0" max="0" value="0" data-t-title title="The experiment's history: everything shown is as of this moment">
    <span id="time" class="time mono"></span>
  </div>
</div>
<!-- a demonstration's screens, Watch · Explore · Lab work (run.html?demo=<world>&screen=…; design
     lfphys/sources/explore_2026-11-14_design.md §3): demo.js fills it and hides the player above; without ?demo= it stays
     empty and player.js runs the page -->
<div id="demo" class="demo" hidden></div>
<script type="module" src="static/js/player.js"></script>
<script type="module" src="static/js/demo.js"></script>
<script type="module" src="static/js/instruments.js"></script><!-- [LB1 P16.3 instruments] the "Instruments" panel -->
</body>
</html>

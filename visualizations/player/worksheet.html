<style>
/* A lab's task sheet (js/worksheet.js; design lfphys/sources/explore_2026-11-14_design.md §2.3, revised by
   explore_EX2_2026-11-18_design.md §5 F8): every printed page is one .sheet: the head and the task, one sheet per part,
   and «Computed for this bench» on a page of its own when asked for, each exactly one A4 page with the attribution line
   at its foot (review EX1-screens F6, EX1-worlds F7). The goal, the procedure, the record list and the teacher's task
   are editable before printing (.editable) */
html, body { height: auto; }
.ws { max-width: 820px; margin: 0 auto; padding: 16px; font-size: 15px; line-height: 1.45; }
.ws h1 { font-size: 22px; margin: 6px 0 4px; } .ws h2 { font-size: 18px; margin: 12px 0 6px; } .ws h3 { font-size: 16px; margin: 10px 0 4px; }
.ws .sheet { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 0 0 16px; background: var(--panel); }
.ws .sheet-body { flex: 1 1 auto; min-height: 0; }
.ws .frp { color: var(--muted); }
.ws .variant { font-weight: 600; margin: 0 0 4px; }
.ws .who { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 6px 0 8px; }
.ws .who > span { display: inline-flex; align-items: flex-end; gap: 4px; }
.ws .who .fill { display: inline-block; min-width: 9em; border-bottom: 1px solid var(--ink); height: 1.2em; }
.ws .mgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 18px; align-items: start; }
.ws .tbl { max-width: 100%; overflow-x: auto; }
.ws table.blank { border-collapse: collapse; width: 100%; margin: 4px 0 8px; }
.ws table.blank th, .ws table.blank td { border: 1px solid var(--ink); padding: 2px 6px; height: 22px; text-align: center; font-weight: 400; }
.ws .axes { border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); height: 170px; margin: 6px 0 22px 30px; position: relative; max-width: 420px; }
.ws .axes .ax { position: absolute; font-size: 13px; color: var(--muted); }
.ws .axes .ay { left: 6px; top: -2px; } .ws .axes .axx { right: 0; bottom: -20px; }
.ws .plot-how { margin: 2px 0; }
.ws .laws { margin: 2px 0 6px; padding-left: 20px; }
.ws .concl { margin: 8px 0 0; }
.ws .lines { border-bottom: 1px solid var(--line); height: 26px; }
.ws .field { margin: 6px 0; }
.ws .field > b { display: block; }
.ws .editable { border: 1px dashed var(--line); border-radius: 6px; padding: 2px 6px; min-height: 1.6em; }
.ws .editable:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.ws .editable p { margin: 3px 0; }
.ws .editable.inline { display: inline-block; min-width: 60%; }
.ws .editable.free { min-height: 5em; }
.ws .bench p { margin: 3px 0; }
.ws .preset { color: var(--ink); }
.ws-hint { max-width: 820px; margin: 0 auto 8px; padding: 0 16px; font-size: 13px; }
.ws-tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.ws-tools label { display: inline-flex; gap: 6px; align-items: center; min-height: 40px; }
.ws-tools select { min-height: 36px; max-width: 100%; min-width: 0; }
.ws-tools label.variant-pick { max-width: 100%; min-width: 0; flex-wrap: wrap; }
.ws .note { font-size: 13px; color: var(--muted); }
.ws .credit { font-size: 11px; color: var(--muted); margin: 10px 0 0; overflow-wrap: anywhere; }
@media print {
  .ws .tbl { overflow: visible; }
  .topbar, .ws-tools, .ws-hint { display: none !important; }
  .ws .editable { border: 0; padding: 0; }
  body { background: #fff; color: #000; }
  @page { size: A4; margin: 12mm 12mm 11mm; }
  .ws { max-width: none; padding: 0; font-size: 10pt; line-height: 1.3; }
  .ws h1 { font-size: 15pt; margin: 0 0 2mm; } .ws h2 { font-size: 13pt; margin: 2mm 0 1.5mm; } .ws h3 { font-size: 11pt; margin: 2mm 0 1mm; }
  /* one sheet = one page: the page's height less its margins (297 − 23 mm) and a little room for rounding */
  .ws .sheet { height: 273mm; border: 0; border-radius: 0; padding: 0; margin: 0; background: none; break-before: page; page-break-before: always; break-inside: avoid; overflow: hidden; }
  .ws .sheet.first { break-before: auto; page-break-before: auto; }
  .ws table.blank th, .ws table.blank td { height: 5.1mm; padding: 0 1.5mm; font-size: 9.5pt; }
  .ws .axes { height: 52mm; margin: 2mm 0 6mm 8mm; max-width: none; }
  .ws .lines { height: 7mm; border-bottom-color: #888; }
  .ws .who .fill { min-width: 38mm; }
  .ws .note, .ws .frp { font-size: 8.5pt; }
  .ws .credit { font-size: 7.5pt; color: #444; margin-top: 2mm; }
}
@media (max-width: 600px) {
  .ws { padding: 10px; } .ws table.blank { font-size: 13px; }
  .ws .mgrid { grid-template-columns: minmax(0, 1fr); }
  .ws .sheet { padding: 10px; }
}
</style>

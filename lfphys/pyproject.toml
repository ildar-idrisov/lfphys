[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lfphys"
version = "0.1.0"
description = "lfphys, a physics engine: an accurate core of established physics and, outside it, widely used theories and declared alternatives"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "Ildar Idrisov", email = "idrisov.sci@gmail.com" }]
# not published yet: PyPI rejects any package with a "Private ::" classifier (no accidental upload; STATUS V20)
classifiers = ["Private :: Do Not Upload"]
dependencies = ["numpy>=2.0", "scipy>=1.15", "mpmath>=1.3"]

[tool.setuptools.packages.find]
include = ["lfphys*"]

[tool.setuptools.package-data]
lfphys = ["locales/*.json"]  # the catalogues of the engine's user-facing texts (lfphys.i18n)

[tool.pytest.ini_options]
testpaths = ["tests"]
